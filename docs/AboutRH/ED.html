<center><h1>Entropic Decisions</h1></center>
<pre style="font-family:monospace; font-size:14px;">
AneoEngine uses pure entropic decisions.
Every entry will have a new entropic decision value. Every value is a randomly
generated 64-bit hexadecimal value. You can generate your own on AneoEngine by
pressing [F4] or running "<span style="color: #0000AA;">n;</span>".
